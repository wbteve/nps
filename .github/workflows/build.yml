name: build

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  GO_VERSION: '1.22'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux,   arch: amd64,  suffix: linux_amd64   }
          - { os: linux,   arch: arm64,  suffix: linux_arm64   }
          - { os: linux,   arch: arm,    goarm: '7', suffix: linux_armv7 }
          - { os: windows, arch: amd64,  suffix: windows_amd64, ext: '.exe' }
          - { os: darwin,  arch: amd64,  suffix: darwin_amd64  }
          - { os: darwin,  arch: arm64,  suffix: darwin_arm64  }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: 准备源码（npc 的 sdk.go 与 npc.go 冲突，编译前移出）
        run: |
          mv cmd/npc/sdk.go /tmp/sdk.go.bak || true

      - name: 编译 nps 服务端
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" -o dist/nps${{ matrix.ext }} ./cmd/nps

      - name: 编译 npc 客户端
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" -o dist/npc${{ matrix.ext }} ./cmd/npc

      - name: 打包（服务端与客户端分开，避免混淆）
        run: |
          ls -lh dist
          tar czf nps-server_${{ matrix.suffix }}.tar.gz -C dist nps${{ matrix.ext }}
          tar czf npc-client_${{ matrix.suffix }}.tar.gz -C dist npc${{ matrix.ext }}
          echo "--- 校验包内文件 ---"
          tar tzf nps-server_${{ matrix.suffix }}.tar.gz
          tar tzf npc-client_${{ matrix.suffix }}.tar.gz
          ls -lh *.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: nps-server_${{ matrix.suffix }}
          path: nps-server_${{ matrix.suffix }}.tar.gz
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: npc-client_${{ matrix.suffix }}
          path: npc-client_${{ matrix.suffix }}.tar.gz
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.tar.gz
          generate_release_notes: true
